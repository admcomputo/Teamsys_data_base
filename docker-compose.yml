version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: teamsys_db
    restart: always
    environment:
      MYSQL_DATABASE: db_portafolios_tis
      MYSQL_USER: teamsys
      MYSQL_PASSWORD: teamsys123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tis-network

volumes:
  mysql_data:

networks:
  tis-network:
    external: true 
